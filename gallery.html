<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kenangan Abadi - Febrian & Alwi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Dancing+Script:wght@600&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gold: #d4af37;
      }
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        height: 100vh;
      }
      .romantic {
        font-family: "Dancing Script", cursive;
      }

      .photo-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: -1;
        padding: 20px;
      }

      #bg-slideshow {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        transition:
          opacity 1.5s ease-in-out,
          transform 1s ease-out;
        border-radius: 20px;
        box-shadow: 0 0 60px rgba(212, 175, 55, 0.25);
      }

      .bg-blur {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-size: cover;
        background-position: center;
        filter: blur(25px) brightness(0.25);
        opacity: 0.7;
        transition: background-image 1.5s ease-in-out;
      }

      .vignette {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle,
          transparent 10%,
          rgba(0, 0, 0, 0.9) 100%
        );
        z-index: 0;
      }

      .overlay-content {
        position: relative;
        z-index: 10;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        text-align: center;
        padding-bottom: 70px;
      }

      .typing-container {
        font-size: 1.25rem;
        color: #f1d592;
        font-family: "Playfair Display", serif;
        font-style: italic;
        min-height: 4.5rem;
        text-shadow: 2px 2px 15px rgba(0, 0, 0, 1);
        max-width: 85%;
        background: rgba(10, 10, 10, 0.5);
        padding: 20px 30px;
        border-radius: 30px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(212, 175, 55, 0.2);
        line-height: 1.6;
      }

      @media (max-width: 768px) {
        .typing-container {
          font-size: 1rem;
          padding: 15px 20px;
          min-height: 5rem;
        }
        .overlay-content {
          padding-bottom: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="fixed opacity-0 pointer-events-none">
      <div id="player"></div>
    </div>

    <div class="bg-blur" id="blur-bg"></div>
    <div class="vignette"></div>

    <div class="photo-container">
      <img id="bg-slideshow" src="img/4.jpeg" />
    </div>

    <div class="overlay-content">
      <div class="mb-5">
        <svg
          width="35"
          height="35"
          viewBox="0 0 24 24"
          fill="var(--gold)"
          class="animate-pulse drop-shadow-[0_0_8px_rgba(212,175,55,0.8)]"
        >
          <path
            d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z"
          />
        </svg>
      </div>

      <div id="typing-text" class="typing-container"></div>

      <div
        class="mt-6 opacity-40 italic text-[8px] md:text-[10px] tracking-[0.4em] text-white uppercase"
      >
        Bersama Kita Kuat, Selamanya Di Hatiku
      </div>
    </div>

    <script>
      const images = [
        "1.jpeg",
        "2.jpeg",
        "3.jpeg",
        "4.jpeg",
        "5.jpeg",
        "6.jpeg",
        "7.jpeg",
        "8.jpeg",
        "9.jpeg",
        "10.jpeg",
        "11.jpeg",
        "12.jpeg",
        "13.jpeg",
        "14.jpeg",
        "15.jpeg",
        "16.jpeg",
        "17.jpeg",
        "18.jpeg",
        "19.jpeg",
        "20.jpeg",
        "21.jpeg",
        "22.jpeg",
        "23.jpeg",
        "24.jpeg",
        "25.jpeg",
        "26.jpeg",
        "27.jpeg",
        "28.jpeg",
        "29.jpeg",
        "30.jpeg",
        "31.jpeg",
        "32.jpeg",
        "33.jpeg",
        "34.jpeg",
      ];

      const quotes = [
        "Sayang, jangan pernah simpan lelahmu sendirian ya...",
        "Kalau ada apa-apa, ceritakan semuanya padaku.",
        "Aku di sini siap mendengar setiap keluh kesahmu.",
        "Biarkan aku membantu meringankan beban di pundakmu.",
        "Apapun masalahnya, kita hadapi bersama-sama.",
        "Jangan sungkan untuk bersandar, aku adalah rumahmu.",
        "Lelahmu adalah lelahku, sedihmu adalah sedihku juga.",
        "Prajurit hebat pun butuh tempat untuk bercerita...",
        "Setiap detik pengabdianmu adalah doa yang kukirim ke langit.",
        "Febrian Romelia Laily... Kamu kebanggaan yang luar biasa.",
        "Masa depan indah sedang menunggu kita di ujung perjuangan ini.",
        "Aku mencintaimu, hari ini, esok, dan selamanya.",
      ];

      let imgIdx = 0;
      let quoteIdx = 0;

      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
          height: "0",
          width: "0",
          videoId: "ohJ8gXJ40lo",
          playerVars: {
            autoplay: 1,
            start: 21,
            loop: 1,
            playlist: "ohJ8gXJ40lo",
          },
          events: { onReady: onPlayerReady },
        });
      }

      function onPlayerReady(event) {
        event.target.playVideo();
        startSequence();
      }

      function startSequence() {
        const bgImg = document.getElementById("bg-slideshow");
        const blurBg = document.getElementById("blur-bg");
        const typingEl = document.getElementById("typing-text");

        blurBg.style.backgroundImage = `url('img/${images[0]}')`;

        setInterval(() => {
          imgIdx = (imgIdx + 1) % images.length;
          bgImg.style.opacity = "0";
          setTimeout(() => {
            const newSrc = `img/${images[imgIdx]}`;
            bgImg.src = newSrc;
            blurBg.style.backgroundImage = `url('${newSrc}')`;
            bgImg.style.opacity = "1";
          }, 1000);
        }, 6000);

        let charIdx = 0;
        function type() {
          if (charIdx < quotes[quoteIdx].length) {
            typingEl.innerHTML += quotes[quoteIdx].charAt(charIdx);
            charIdx++;
            setTimeout(type, 80);
          } else {
            setTimeout(erase, 3500);
          }
        }
        function erase() {
          if (typingEl.innerHTML.length > 0) {
            typingEl.innerHTML = typingEl.innerHTML.slice(0, -1);
            setTimeout(erase, 40);
          } else {
            quoteIdx = (quoteIdx + 1) % quotes.length;
            charIdx = 0;
            setTimeout(type, 600);
          }
        }
        type();
      }
    </script>
  </body>
</html>
